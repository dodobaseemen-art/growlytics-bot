<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growlytics Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #0f0f23; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1a1a2e; padding: 20px; border-radius: 16px; border: 1px solid #2d2d44; }
    .card h3 { color: #888; font-size: 14px; margin-bottom: 8px; }
    .card .value { font-size: 32px; font-weight: 700; color: #667eea; }
    h1 { text-align: center; margin-bottom: 24px; }
    .live { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-left: 8px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <h1>⚙️ Growlytics Admin <span class="live"></span></h1>
  <div class="grid">
    <div class="card"><h3>Total Users</h3><div class="value" id="totalUsers">-</div></div>
    <div class="card"><h3>DAU</h3><div class="value" id="dau">-</div></div>
    <div class="card"><h3>Paid Users</h3><div class="value" id="paidUsers">-</div></div>
    <div class="card"><h3>Total Revenue</h3><div class="value" id="revenue">-</div></div>
    <div class="card"><h3>MRR</h3><div class="value" id="mrr">-</div></div>
    <div class="card"><h3>Conversion</h3><div class="value" id="conversion">-</div></div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
